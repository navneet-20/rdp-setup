name: "PicoShare Temp Share"

on:
  workflow_dispatch:

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl lsof

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Clone PicoShare
        run: |
          git clone https://github.com/mtlynch/picoshare.git
          cd picoshare
          go mod tidy
          go build -o picoshare ./cmd/picoshare

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Start PicoShare and verify
        run: |
          cd picoshare
          mkdir -p data

          echo "Starting PicoShare..."
          PORT=4000 PS_SHARED_SECRET=admin ./picoshare -db data/store.db > pico.log 2>&1 &

          echo "Waiting for server to start..."
          sleep 8

          echo "Checking if port 4000 is listening..."
          if lsof -i :4000; then
            echo "PicoShare is running."
          else
            echo "PicoShare failed to start!"
            echo "====== PicoShare Log ======"
            cat pico.log
            exit 1
          fi

      - name: Start Cloudflare Tunnel
        run: |
          cd picoshare
          cloudflared tunnel --url http://localhost:4000 > cloudflare.log 2>&1 &

          sleep 20

          echo "======================================"
          echo "🌐 OPEN THIS LINK:"
          grep -o 'https://.*\.trycloudflare\.com' cloudflare.log | head -n 1
          echo ""
          echo "🔐 Admin Password: admin"
          echo "======================================"

          sleep 21600
