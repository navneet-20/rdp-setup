name: Temporary File Share
on: 
  workflow_dispatch:
    inputs:
      duration:
        description: 'How long to keep the server alive (e.g., 1h, 30m)'
        default: '1h'
        required: true

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PsiTransfer
        uses: actions/checkout@v4
        with:
          repository: 'psi-transfer/習-transfer' # Official repo
          ref: 'master'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install --production
          mkdir -p data

      - name: Install & Start Cloudflare Tunnel
        run: |
          # Download cloudflared binary
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          
          # Start tunnel in background (Quick Tunnel mode)
          # This generates a random .trycloudflare.com URL
          ./cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
          
      - name: Get Tunnel URL
        run: |
          sleep 5
          grep -o 'https://[-a-z0-9.]*trycloudflare.com' tunnel.log | head -n 1
          echo "URL_FOUND=$(grep -o 'https://[-a-z0-9.]*trycloudflare.com' tunnel.log | head -n 1)" >> $GITHUB_ENV

      - name: Run PsiTransfer
        run: |
          echo "------------------------------------------------"
          echo "SERVER IS LIVE AT: ${{ env.URL_FOUND }}"
          echo "------------------------------------------------"
          
          # Run the app and keep the runner alive for the specified duration
          # PSITRANSFER_PORT defaults to 3000
          NODE_ENV=production npm start & 
          sleep ${{ github.event.inputs.duration }}
