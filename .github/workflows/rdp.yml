name: "PicoShare Temp Share"

on:
  workflow_dispatch:

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Clone PicoShare
        run: |
          git clone https://github.com/mtlynch/picoshare.git
          cd picoshare
          go build -o picoshare ./cmd/picoshare

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Start PicoShare + Tunnel
        run: |
          cd picoshare
          mkdir data

          PORT=4000 PS_SHARED_SECRET=admin ./picoshare -db data/store.db > pico.log 2>&1 &

          sleep 10

          cloudflared tunnel --url http://localhost:4000 > cloudflare.log 2>&1 &
          sleep 20

          echo "======================================"
          echo "🌐 OPEN THIS LINK:"
          grep -o 'https://.*\.trycloudflare\.com' cloudflare.log | head -n 1
          echo ""
          echo "🔐 Login Password:"
          echo "admin"
          echo "======================================"

          sleep 21600
