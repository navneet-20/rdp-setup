name: Windows 2025 Remote Desktop
on: 
  workflow_dispatch:
    inputs:
      duration:
        description: 'Time to run (e.g., 4h)'
        default: '4h'

jobs:
  rdp-session:
    runs-on: windows-2025
    steps:
      - name: 1. Configure User
        shell: pwsh
        run: |
          # Change password for the existing runneradmin
          $Password = "MySecurePass123!"
          net user runneradmin $Password
          
          # Try to add to admin group but don't fail if already there
          net localgroup administrators runneradmin /add 2>$null
          exit 0 

      - name: 2. Optimize for Remote Access
        run: |
          # Disable Windows Defender for better UI speed
          Set-MpPreference -DisableRealtimeMonitoring $true
          # Disable screen lock/sleep
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0

      - name: 3. Setup Tunnel (Ngrok)
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          choco install ngrok -y
          ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
          # Start tunnel for RDP
          Start-Process ngrok -ArgumentList "tcp 3389"
          
      - name: 4. Get Connection Details
        shell: pwsh
        run: |
          Start-Sleep -s 12
          $JSON = Invoke-RestMethod http://localhost:4040/api/tunnels
          $FullAddr = $JSON.tunnels[0].public_url
          $CleanAddr = $FullAddr.Replace("tcp://", "")
          echo "================================================"
          echo "RDP ADDRESS: $CleanAddr"
          echo "USER:        runneradmin"
          echo "PASSWORD:    MySecurePass123!"
          echo "================================================"

      - name: 5. Keep Alive
        shell: pwsh
        run: |
          $val = "${{ github.event.inputs.duration }}"
          $hours = [int]$val.Replace("h","")
          Write-Host "Runner is live. The session will expire in $hours hours."
          Start-Sleep -s ($hours * 3600)
