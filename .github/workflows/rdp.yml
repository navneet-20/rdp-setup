name: Windows 2025 Remote Desktop
on: 
  workflow_dispatch:
    inputs:
      duration:
        description: 'Time to run (e.g., 4h)'
        default: '4h'

jobs:
  rdp-session:
    runs-on: windows-2025
    steps:
      - name: 1. Configure User
        shell: pwsh
        run: |
          $Password = "MySecurePass123!"
          net user runneradmin $Password
          net localgroup administrators runneradmin /add 2>$null
          exit 0 

      - name: 2. Optimize & Install
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          choco install ngrok -y

      - name: 3. Start Tunnel
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
          # Use Start-Process with -PassThru to ensure it detaches correctly
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389 --region us" -WindowStyle Hidden

      - name: 4. Get Connection Details (With Retry)
        shell: pwsh
        run: |
          Write-Host "Waiting for Ngrok API to wake up..."
          $MaxRetries = 10
          $RetryCount = 0
          $JSON = $null

          while ($RetryCount -lt $MaxRetries) {
              try {
                  $JSON = Invoke-RestMethod http://localhost:4040/api/tunnels
                  if ($JSON.tunnels.Count -gt 0) { break }
              } catch {
                  Write-Host "Attempt $($RetryCount + 1): API not ready yet..."
                  Start-Sleep -s 5
                  $RetryCount++
              }
          }

          if ($JSON -and $JSON.tunnels.Count -gt 0) {
              $FullAddr = $JSON.tunnels[0].public_url
              $CleanAddr = $FullAddr.Replace("tcp://", "")
              echo "================================================"
              echo "RDP ADDRESS: $CleanAddr"
              echo "USER:        runneradmin"
              echo "PASSWORD:    MySecurePass123!"
              echo "================================================"
          } else {
              Write-Error "Ngrok failed to start or provide a URL."
              exit 1
          }

      - name: 5. Keep Alive
        shell: pwsh
        run: |
          $val = "${{ github.event.inputs.duration }}"
          $hours = [int]$val.Replace("h","")
          Start-Sleep -s ($hours * 3600)
