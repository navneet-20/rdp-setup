name: Temporary File Share
on: 
  workflow_dispatch:
    inputs:
      duration:
        description: 'How long to keep the server alive (e.g., 3600s for 1h)'
        default: '3600'
        required: true

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - name: Clone PsiTransfer
        run: |
          git clone --depth 1 https://github.com/psi-transfer/psitransfer.git .
          
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install --production
          mkdir -p data

      - name: Setup Cloudflare Tunnel
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          # Start tunnel and background it
          ./cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
          
      - name: Show Connection URL
        run: |
          echo "Waiting for Cloudflare to generate URL..."
          sleep 8
          URL=$(grep -o 'https://[-a-z0-9.]*trycloudflare.com' tunnel.log | head -n 1)
          echo "------------------------------------------------"
          echo "SERVER IS LIVE AT: $URL"
          echo "------------------------------------------------"
          # Store for later steps if needed
          echo "FINAL_URL=$URL" >> $GITHUB_ENV

      - name: Run Server
        run: |
          # Start PsiTransfer in the background
          NODE_ENV=production npm start &
          
          echo "Sharing is active. The runner will terminate in ${{ github.event.inputs.duration }} seconds."
          # This keeps the runner busy so it doesn't close
          sleep ${{ github.event.inputs.duration }}
