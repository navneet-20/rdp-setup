name: "PicoShare Temp Share"

on:
  workflow_dispatch:

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar

      - name: Download PicoShare
        run: |
          curl -L https://github.com/mtlynch/picoshare/releases/latest/download/picoshare-linux-amd64.tar.gz -o pico.tar.gz
          tar -xzf pico.tar.gz
          chmod +x picoshare

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Start PicoShare + Tunnel
        run: |
          mkdir data

          ./picoshare \
            -data-dir ./data \
            -port 4000 > pico.log 2>&1 &

          sleep 8

          cloudflared tunnel --url http://localhost:4000 > cloudflare.log 2>&1 &
          sleep 20

          echo "======================================"
          echo "🌐 OPEN THIS LINK:"
          grep -o 'https://.*\.trycloudflare\.com' cloudflare.log | head -n 1
          echo "======================================"

          sleep 21600
