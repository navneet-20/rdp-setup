name: Temp File Share (Go)
on: 
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds to stay alive'
        default: '3600'

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - name: Download GoHTTPServer Binary
        run: |
          # Download the standalone binary
          curl -L https://github.com/codeskyblue/gohttpserver/releases/download/1.1.5/gohttpserver_1.1.5_linux_amd64.tar.gz | tar -xz
          chmod +x gohttpserver
          mkdir -p uploads

      - name: Setup Cloudflare Tunnel
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:8000 > tunnel.log 2>&1 &
          
      - name: Get URL
        run: |
          sleep 10
          URL=$(grep -o 'https://[-a-z0-9.]*trycloudflare.com' tunnel.log | head -n 1)
          echo "------------------------------------------------"
          echo "SERVER IS LIVE AT: $URL"
          echo "------------------------------------------------"

      - name: Run Server
        run: |
          # --upload: Enables the upload button
          # --delete: Allows deleting via UI
          ./gohttpserver --root ./uploads --upload --delete --addr :8000 &
          sleep ${{ github.event.inputs.duration }}
