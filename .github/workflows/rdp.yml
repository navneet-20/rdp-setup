name: Simple Windows RDP (Ngrok)
on: 
  workflow_dispatch:
    inputs:
      duration:
        description: 'Hours to stay alive'
        default: '6h'

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Set Password
        run: |
          net user runneradmin MySecurePass123!
          
      - name: Install Ngrok
        run: |
          curl.exe -L -o ngrok.zip https://bin.equinox.io/c/b34edq6jh9X/ngrok-v3-stable-windows-amd64.zip
          Expand-Archive ngrok.zip

      - name: Start RDP Tunnel
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          .\ngrok\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN
          # Start tunnel for RDP port 3389
          Start-Process .\ngrok\ngrok.exe -ArgumentList "tcp 3389"
          
      - name: Get RDP Address
        shell: pwsh
        run: |
          Start-Sleep -s 10
          # Query Ngrok API to get the public URL
          $JSON = Invoke-RestMethod http://localhost:4040/api/tunnels
          $Addr = $JSON.tunnels[0].public_url
          echo "------------------------------------------------"
          echo "ADDRESS:  $Addr"
          echo "USER:     runneradmin"
          echo "PASSWORD: MySecurePass123!"
          echo "------------------------------------------------"

      - name: Wait for Session
        shell: pwsh
        run: |
          $hours = "${{ github.event.inputs.duration }}".Replace("h","")
          Start-Sleep -s ([int]$hours * 3600)
