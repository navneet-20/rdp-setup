name: "Temp Share Clean"

on:
  workflow_dispatch:

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget

      - name: Download go-http-file-server
        run: |
          wget https://github.com/mjpclab/go-http-file-server/releases/latest/download/go-http-file-server_linux_amd64 -O fileserver
          chmod +x fileserver

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Start File Server + Tunnel
        run: |
          mkdir shared

          # start file server with upload enabled
          ./fileserver -r ./shared --upload --port 8080 > server.log 2>&1 &

          sleep 5

          # start Cloudflare tunnel
          cloudflared tunnel --url http://localhost:8080 > cloudflare.log 2>&1 &

          sleep 20

          echo "======================================"
          echo "🌐 OPEN THIS LINK:"
          grep -o 'https://.*\.trycloudflare\.com' cloudflare.log | head -n 1
          echo "======================================"

          sleep 21600
