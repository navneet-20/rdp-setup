name: "Temporary File Share"

on:
  workflow_dispatch:

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl lsof

      - name: Download Miniserve binary
        run: |
          curl -L https://github.com/svenstaro/miniserve/releases/latest/download/miniserve-linux-amd64 -o miniserve
          chmod +x miniserve

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Start File Server
        run: |
          mkdir shared

          echo "Starting Miniserve..."
          ./miniserve shared \
            --port 8080 \
            --upload-files \
            --overwrite-files \
            --no-auth > server.log 2>&1 &

          sleep 5

          echo "Checking if port 8080 is listening..."
          if lsof -i :8080; then
            echo "Miniserve is running."
          else
            echo "Miniserve failed!"
            cat server.log
            exit 1
          fi

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://localhost:8080 > cloudflare.log 2>&1 &
          sleep 20

          echo "======================================"
          echo "🌐 OPEN THIS LINK:"
          grep -o 'https://.*\.trycloudflare\.com' cloudflare.log | head -n 1
          echo "======================================"

          sleep 21600
