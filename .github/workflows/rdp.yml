name: Windows 2025 Remote Desktop
on: 
  workflow_dispatch:
    inputs:
      duration:
        description: 'Time to run (e.g., 4h)'
        default: '4h'

jobs:
  rdp-session:
    runs-on: windows-2025
    steps:
      - name: 1. Set User Credentials
        run: |
          net user runneradmin MySecurePass123!
          net localgroup administrators runneradmin /add
          
      - name: 2. Performance & Sleep Fix
        run: |
          # Disable Windows Defender (frees up CPU)
          Set-MpPreference -DisableRealtimeMonitoring $true
          # Prevent monitor/standby timeouts
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0

      - name: 3. Install & Start Ngrok
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          choco install ngrok -y
          ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
          # Start TCP tunnel for RDP Port 3389
          Start-Process ngrok -ArgumentList "tcp 3389"
          
      - name: 4. Display Connection Info
        shell: pwsh
        run: |
          Start-Sleep -s 12
          $JSON = Invoke-RestMethod http://localhost:4040/api/tunnels
          $FullAddr = $JSON.tunnels[0].public_url
          $CleanAddr = $FullAddr.Replace("tcp://", "")
          echo "================================================"
          echo "RDP ADDRESS: $CleanAddr"
          echo "USER:        runneradmin"
          echo "PASSWORD:    MySecurePass123!"
          echo "================================================"

      - name: 5. Keep Alive Loop
        shell: pwsh
        run: |
          $val = "${{ github.event.inputs.duration }}"
          $hours = [int]$val.Replace("h","")
          Write-Host "Runner is live. Connect now!"
          Start-Sleep -s ($hours * 3600)
