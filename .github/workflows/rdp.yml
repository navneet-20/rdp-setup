name: Windows RDP Runner
on: 
  workflow_dispatch:
    inputs:
      duration:
        description: 'Time to keep alive (e.g., 2h)'
        default: '2h'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Set Password
        run: |
          # Sets the password for the 'runneradmin' user
          net user runneradmin MySecurePass123!
          
      - name: Install & Start Cloudflare Tunnel
        shell: pwsh
        run: |
          curl.exe -L --output cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
          # Start a TCP tunnel for RDP (Port 3389)
          Start-Process ./cloudflared.exe -ArgumentList "tunnel --url tcp://localhost:3389" -RedirectStandardOutput "tunnel.log"
          
      - name: Get RDP URL
        shell: pwsh
        run: |
          echo "Waiting for tunnel..."
          Start-Sleep -s 15
          $Url = Select-String -Path "tunnel.log" -Pattern "tcp://[-a-z0-9.]*trycloudflare.com:[0-9]+" | Select-Object -ExpandProperty Matches | Select-Object -ExpandProperty Value
          echo "------------------------------------------------"
          echo "RDP ADDRESS: $Url"
          echo "USERNAME: runneradmin"
          echo "PASSWORD: MySecurePass123!"
          echo "------------------------------------------------"

      - name: Keep Alive
        shell: pwsh
        run: |
          # Keeps the runner from finishing
          $duration = "${{ github.event.inputs.duration }}"
          if ($duration -like "*h") { $sec = [int]$duration.Replace("h","") * 3600 }
          else { $sec = 3600 }
          Start-Sleep -s $sec
