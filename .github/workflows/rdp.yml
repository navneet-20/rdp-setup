name: "Simple Temp Share"

on:
  workflow_dispatch:

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Install Caddy
        run: |
          curl -L https://github.com/caddyserver/caddy/releases/latest/download/caddy_linux_amd64.tar.gz -o caddy.tar.gz
          tar -xzf caddy.tar.gz
          chmod +x caddy

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Start File Server
        run: |
          mkdir shared

          # start simple file server
          ./caddy file-server --root ./shared --listen :8080 > server.log 2>&1 &

          sleep 5

          # start Cloudflare tunnel
          cloudflared tunnel --url http://localhost:8080 > cloudflare.log 2>&1 &

          sleep 15

          echo "======================================"
          echo "🌐 OPEN THIS LINK:"
          grep -o 'https://.*\.trycloudflare\.com' cloudflare.log | head -n 1
          echo ""
          echo "📂 Upload files using:"
          echo "curl -T filename <link>/filename"
          echo "======================================"

          sleep 21600
