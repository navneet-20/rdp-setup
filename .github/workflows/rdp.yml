name: Simple Windows RDP (Ngrok)
on: 
  workflow_dispatch:
    inputs:
      duration:
        description: 'Hours to stay alive'
        default: '6h'

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Set Password
        run: |
          net user runneradmin MySecurePass123!
          
      - name: Install Ngrok via Choco
        run: |
          choco install ngrok -y

      - name: Start RDP Tunnel
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Configure and start ngrok
          ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
          Start-Process ngrok -ArgumentList "tcp 3389"
          
      - name: Get RDP Address
        shell: pwsh
        run: |
          # Give Ngrok time to initialize
          Start-Sleep -s 10
          $JSON = Invoke-RestMethod http://localhost:4040/api/tunnels
          $Addr = $JSON.tunnels[0].public_url
          # Standardizing the address for RDP client
          $RdpAddr = $Addr.Replace("tcp://", "")
          echo "------------------------------------------------"
          echo "ADDRESS:  $RdpAddr"
          echo "USER:     runneradmin"
          echo "PASSWORD: MySecurePass123!"
          echo "------------------------------------------------"

      - name: Wait for Session
        shell: pwsh
        run: |
          $hours = "${{ github.event.inputs.duration }}".Replace("h","")
          # Keep the runner alive
          Start-Sleep -s ([int]$hours * 3600)
          
